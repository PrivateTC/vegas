<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krupiér · Little Las Vegas</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#140a22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: jeden sloupec pro telefon; nahoře kdo čeká (to je práce krupiéra), pod tím kdo sedí a kdo pasoval. */
:root{color-scheme:dark; --night:#140a22; --night-2:#2b1040; --red:#e3203d; --bulb:#ffd66e; --cream:#fff2d2; --ink:#24101a;
  --cyan:#3fe3d4; --felt:#0e5140; --text:#f4e9ff; --muted:#b8a6cc; --line:rgba(255,214,110,.28);
  --f-display:"Limelight","Rockwell","Georgia",serif; --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif; --f-mono:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:radial-gradient(120% 55% at 50% 100%, var(--night-2), transparent 70%), var(--night); color:var(--text); font:400 17px/1.5 var(--f-body)}
.wrap{max-width:520px; margin:0 auto; padding-block:26px 44px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:20px}
.kicker{margin:0; font:600 13px/1 var(--f-cond); letter-spacing:.32em; text-transform:uppercase; color:var(--bulb)}
h1{margin:0; font:400 34px/1.05 var(--f-display); text-wrap:balance}
.lead{margin:0; color:var(--muted)}
section{display:flex; flex-direction:column; gap:10px}
h2{margin:0; font:700 14px/1 var(--f-cond); letter-spacing:.22em; text-transform:uppercase; color:var(--bulb); display:flex; gap:8px; align-items:baseline}
h2 span{color:var(--text); letter-spacing:.04em}
ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
li{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
  background:linear-gradient(135deg,#2a1238 0%,#170a26 55%,#32143f 100%)}
li.wait{border-color:var(--bulb); box-shadow:0 0 0 1px rgba(255,214,110,.25), 0 8px 22px rgba(0,0,0,.4)}
.who{min-width:0; flex:1; display:flex; flex-direction:column; gap:2px}
.who b{font:700 22px/1.1 var(--f-cond); letter-spacing:.02em; overflow-wrap:anywhere}
.who small{font:400 12px/1.2 var(--f-mono); color:var(--muted)}
button{appearance:none; border:0; cursor:pointer; font:700 16px/1 var(--f-cond); letter-spacing:.1em; text-transform:uppercase; border-radius:12px; min-height:46px; padding:0 16px}
.go{background:var(--bulb); color:var(--ink); box-shadow:0 4px 0 #b98f2e}
.go:active{transform:translateY(3px); box-shadow:0 1px 0 #b98f2e}
.undo{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1.5px rgba(184,166,204,.5); font-size:13px}
.undo.sure{color:#fff; background:var(--red); box-shadow:none}
.host{font:600 12px/1 var(--f-mono); color:var(--bulb); letter-spacing:.1em}
button[disabled]{opacity:.55; cursor:progress}
button:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
.empty{margin:0; padding:14px; border:1px dashed var(--line); border-radius:14px; color:var(--muted); text-align:center}
.err{margin:0; padding:12px 14px; border-radius:12px; background:rgba(227,32,61,.16); border:1px solid rgba(227,32,61,.55); color:#ffd9df}
.bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.refresh{background:transparent; color:var(--bulb); box-shadow:inset 0 0 0 2px var(--bulb)}
.stamp{margin:0; font:400 12px/1.3 var(--f-mono); color:var(--muted)}
#app{display:flex; flex-direction:column; gap:22px}
.count{margin:0; font:400 44px/1 var(--f-display); color:var(--bulb)}
.count small{font:600 14px/1 var(--f-cond); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-left:8px}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Little Las Vegas · krupiér</p>
  <h1>Kdo sedí u stolu?</h1>
  <p class="lead">Kdo dá ALL IN, sedne si rovnou a vidí kdy a kde. Tady máš přehled a můžeš komukoli vzít židli.</p>
  <p class="err" id="msg" role="alert" hidden></p>
  <div id="app" hidden>
    <p class="count"><span id="n-sedi-big">0</span><small>u stolu</small></p>
    <section>
      <h2>Bez židle <span id="n-ceka"></span></h2>
      <ul id="l-ceka"></ul>
      <p class="empty" id="e-ceka">Nikdo. Sem spadne ten, komu vezmeš židli.</p>
    </section>
    <section>
      <h2>U stolu <span id="n-sedi"></span></h2>
      <ul id="l-sedi"></ul>
    </section>
    <section id="s-ne" hidden>
      <h2>Pasovali <span id="n-ne"></span></h2>
      <ul id="l-ne"></ul>
    </section>
    <div class="bar">
      <button class="refresh" id="obnovit" type="button">Obnovit</button>
      <p class="stamp" id="stamp"></p>
    </div>
  </div>
</main>
<script>
(function(){
  var HOOK = "https://hook.eu1.make.com/g4rav64rw2925f4n3k26gvdk8jzpdr0b";
  var KLIC = (location.hash || "").replace(/^#/, "");
  var KRALOVE = ["robert", "ivan"];
  var $ = function(id){ return document.getElementById(id); };
  var busy = false, kol = 0, casovac = null;

  function chyba(t){ var m = $("msg"); m.textContent = t; m.hidden = !t; }
  function api(pole){
    pole.klic = KLIC;
    return fetch(HOOK, {method:"POST", body:new URLSearchParams(pole)})
      .then(function(r){ return r.text(); })
      .then(function(t){ var d = null; try { d = JSON.parse(t); } catch(e){} if (!d || !d.ok){ var er = new Error("klic"); er.kind = "klic"; throw er; } return d; });
  }
  function kdy(s){ var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(s || ""); return m ? (+m[3]) + ". " + (+m[2]) + ". " + m[4] : (s || ""); }

  function radek(z, typ){
    var li = document.createElement("li"); if (typ === "ceka") li.className = "wait";
    var w = document.createElement("div"); w.className = "who";
    var b = document.createElement("b"); b.textContent = z.jmeno;
    var s = document.createElement("small"); s.textContent = (typ === "ne" ? "pas " : "ALL IN ") + kdy(z.cas);
    w.appendChild(b); w.appendChild(s); li.appendChild(w);
    if (typ === "ceka"){
      var go = document.createElement("button"); go.type = "button"; go.className = "go"; go.textContent = "Pustit ke stolu";
      go.addEventListener("click", function(){ akce("pust", z.jmeno, go, "Rozdávám…"); });
      li.appendChild(go);
    } else if (typ === "sedi"){
      if (KRALOVE.indexOf(z.jmeno.toLowerCase()) !== -1){
        var h = document.createElement("span"); h.className = "host"; h.textContent = "hostitel"; li.appendChild(h);
      } else {
        var un = document.createElement("button"); un.type = "button"; un.className = "undo"; un.textContent = "Vzít židli";
        un.addEventListener("click", function(){
          if (!un.classList.contains("sure")){ un.classList.add("sure"); un.textContent = "Opravdu vzít?"; setTimeout(function(){ un.classList.remove("sure"); un.textContent = "Vzít židli"; }, 4000); return; }
          akce("odeber", z.jmeno, un, "Beru…");
        });
        li.appendChild(un);
      }
    }
    return li;
  }

  function kresli(d){
    var ceka = [], sedi = [], ne = [];
    String(d.radky || "").split("|").forEach(function(r){
      if (!r.trim()) return;
      var p = r.split(";"), z = {odpoved:p[0], pusten:p[1], cas:p[2], jmeno:p.slice(3).join(";").trim()};
      if (!z.jmeno) return;
      if (z.odpoved === "ne") ne.push(z); else if (z.pusten === "1") sedi.push(z); else ceka.push(z);
    });
    function napln(id, list, typ){ var ul = $(id); ul.textContent = ""; list.forEach(function(z){ ul.appendChild(radek(z, typ)); }); }
    napln("l-ceka", ceka, "ceka"); napln("l-sedi", sedi, "sedi"); napln("l-ne", ne, "ne");
    $("e-ceka").hidden = ceka.length > 0; $("s-ne").hidden = ne.length === 0;
    $("n-ceka").textContent = "(" + ceka.length + ")"; $("n-sedi").textContent = "(" + sedi.length + ")"; $("n-ne").textContent = "(" + ne.length + ")";
    $("n-sedi-big").textContent = sedi.length;
    var t = new Date(); $("stamp").textContent = "Naposledy načteno " + ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
    $("app").hidden = false;
  }

  function nacti(){
    return api({odpoved:"prehled"}).then(function(d){ chyba(""); kresli(d); })
      .catch(function(e){ chyba(e && e.kind === "klic" ? "Tenhle odkaz krupiéra neplatí. Požádej Roberta o nový." : "Nepovedlo se načíst. Zkontroluj připojení a dej Obnovit."); });
  }
  function akce(co, jmeno, btn, text){
    if (busy) return; busy = true; var old = btn.textContent; btn.disabled = true; btn.textContent = text;
    api({odpoved:co, jmeno:jmeno}).then(nacti)
      .catch(function(){ chyba("Nepovedlo se to zapsat. Zkus to znovu."); btn.disabled = false; btn.textContent = old; })
      .then(function(){ busy = false; });
  }

  $("obnovit").addEventListener("click", function(){ kol = 0; nacti(); plan(); });
  // samo se obnovuje jednou za minutu, jen když je stránka vidět, nejvýš 30× po sobě (pak tlačítkem)
  function plan(){
    clearInterval(casovac);
    casovac = setInterval(function(){
      if (document.visibilityState !== "visible" || busy) return;
      if (++kol > 30){ clearInterval(casovac); $("stamp").textContent += " · samo se už neobnovuje, dej Obnovit"; return; }
      nacti();
    }, 60000);
  }

  if (!KLIC){ chyba("Chybí klíč v odkazu. Otevři celý odkaz, který ti poslal Robert."); return; }
  nacti(); plan();
})();
</script>
</body>
</html>
